<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.name | replace: ".md", "" | capitalize }}</title>
    <link rel="stylesheet" href="styl.css">
    
<style>
        /* 1. CELÉ TĚLO - odstraníme výchozí okraje prohlížeče */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: sans-serif;
            overflow-x: hidden; /* Zabrání nechtěnému vodorovnému posunu */
        }

        /* 2. HLAVNÍ NÁZEV (stále na střed) */
        .page-header-title {
            text-align: center;
            text-transform: uppercase;
            font-size: clamp(1.5em, 10vw, 3.5em);
            font-weight: 900;
            margin: 30px 0;
            width: 100%;
        }

        /* 3. OBSAH PŘES CELOU ŠÍŘKU */
        main {
            text-align: left;
            width: 100%;        /* Využije 100% dostupné šířky */
            max-width: 100%;    /* Zrušíme jakékoli omezení šířky */
            padding-left: 15px; /* Pevná malá mezera vlevo, aby text nebyl na hraně */
            padding-right: 2%;  /* Požadované 2% odsazení vpravo */
            box-sizing: border-box; /* Klíčové: padding se započítá do 100% šířky */
        }

        /* 4. ZAJIŠTĚNÍ ZAROVNÁNÍ VLEVO PRO VŠE V MAIN */
        main h1, main h2, main h3, main p, main pre, main ul {
            text-align: left !important;
            margin-left: 0;
        }

        /* 5. TABULKY A DLOUHÉ KÓDY */
        pre, code {
            white-space: pre-wrap;       /* Zalomí dlouhé winget příkazy, aby nepřetékaly */
            word-wrap: break-word;
            background: #f4f4f4;        /* Lehké zvýraznění kódu */
            padding: 10px;
            display: block;
        }
    </style>

    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register("{{ '/service-worker.js' | relative_url }}").then(function(registration) {
            console.log('ServiceWorker registrován!');
          }, function(err) {
            console.log('ServiceWorker selhal: ', err);
          });
        });
      }
    </script>
</head>
<body>

    <header>
        <h1 class="page-header-title">
            {{ page.name | replace: ".md", "" }}
        </h1>
    </header>

    <main>
        {{ content }}
    </main>

</body>
</html>
