<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.name | replace: ".md", "" | capitalize }}</title>
    <link rel="stylesheet" href="styl.css">
    
    <style>
        .page-header-title {
            text-align: center;
            text-transform: uppercase; /* Všechna písmena velká */
            font-size: 3em;           /* Pořádná velikost */
            font-weight: 900;          /* Hodně tučné */
            margin: 40px 0;            /* Mezera nad a pod nadpisem */
            letter-spacing: 2px;       /* Mírné rozestupy mezi písmeny pro styl */
        }
    </style>

    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register("{{ '/service-worker.js' | relative_url }}").then(function(registration) {
            console.log('ServiceWorker registrován!');
          }, function(err) {
            console.log('ServiceWorker selhal: ', err);
          });
        });
      }
    </script>
</head>
<body>

    <header>
        <h1 class="page-header-title">
            {{ page.name | replace: ".md", "" }}
        </h1>
    </header>

    <main>
        {{ content }}
    </main>

</body>
</html>
