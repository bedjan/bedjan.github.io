<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.name | replace: ".md", "" | capitalize }}</title>
    <link rel="stylesheet" href="styl.css">
    
<style>
        /* 1. CELÉ TĚLO STRÁNKY */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif; /* Nebo tvé oblíbené písmo */
        }

        /* 2. HLAVNÍ NÁZEV (vždy nahoře uprostřed) */
        .page-header-title {
            text-align: center;
            text-transform: uppercase;
            font-size: clamp(1.5em, 8vw, 3em); /* Responzivní velikost písma */
            font-weight: 900;
            margin: 30px 0;
            width: 100%;
        }

        /* 3. OBSAH (vždy vlevo, responzivní) */
        main {
            text-align: left;
            width: 100%;
            max-width: 900px;      /* Maximální šířka řádku pro dobrou čitelnost */
            margin-left: 0;        /* Zarovnání bloku k levému okraji */
            padding-left: 2%;      /* Malé responzivní odsazení od levého okraje (cca 20-30px) */
            padding-right: 2%;     /* Odsazení od pravého okraje pro mobily */
            box-sizing: border-box; /* Aby padding nezvětšoval šířku nad 100% */
        }

        /* 4. NADPISY V OBSAHU (vždy vlevo) */
        main h1, main h2, main h3 {
            text-align: left !important;
            margin-top: 1.2em;
            margin-bottom: 0.5em;
        }

        /* 5. TABULKY A OBRÁZKY (aby nepřetékaly) */
        img, table {
            max-width: 100%;
            height: auto;
        }
    </style>

    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register("{{ '/service-worker.js' | relative_url }}").then(function(registration) {
            console.log('ServiceWorker registrován!');
          }, function(err) {
            console.log('ServiceWorker selhal: ', err);
          });
        });
      }
    </script>
</head>
<body>

    <header>
        <h1 class="page-header-title">
            {{ page.name | replace: ".md", "" }}
        </h1>
    </header>

    <main>
        {{ content }}
    </main>

</body>
</html>
