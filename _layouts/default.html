<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.name | replace: ".md", "" | capitalize }}</title>
    <link rel="stylesheet" href="styl.css">
    
    <style>
        /* 1. HLAVNÍ NÁZEV STRÁNKY (ten nahoře) */
        .page-header-title {
            text-align: center;      /* Pouze tento bude uprostřed */
            text-transform: uppercase;
            font-size: 3em;
            font-weight: 900;
            margin: 40px 0;
            display: block;
        }

        /* 2. OBSAH STRÁNKY (Markdown text) */
        main {
            text-align: left;        /* Vše v obsahu bude vlevo */
            max-width: 800px;        /* Aby text nebyl přes celou šířku monitoru */
            margin: 0 auto;          /* Vycentrování celého bloku obsahu */
            padding: 0 20px;         /* Odsazení od krajů na mobilu */
        }

        /* 3. OPRAVA NADPISŮ V MARKDOWNU */
        /* Toto zajistí, že # Torrent klienti atd. budou vlevo */
        main h1, main h2, main h3 {
            text-align: left !important; 
            margin-top: 1.5em;
            text-transform: none;    /* Ostatní nadpisy nebudou mít všechna písmena velká, pokud nechceš */
        }
    </style>

    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register("{{ '/service-worker.js' | relative_url }}").then(function(registration) {
            console.log('ServiceWorker registrován!');
          }, function(err) {
            console.log('ServiceWorker selhal: ', err);
          });
        });
      }
    </script>
</head>
<body>

    <header>
        <h1 class="page-header-title">
            {{ page.name | replace: ".md", "" }}
        </h1>
    </header>

    <main>
        {{ content }}
    </main>

</body>
</html>
