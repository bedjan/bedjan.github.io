<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
  <title>{{ page.title | default: page.name }}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    
    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register("{{ '/service-worker.js' | relative_url }}").then(function(registration) {
            console.log('ServiceWorker registrován!');
          }, function(err) {
            console.log('ServiceWorker selhal: ', err);
          });
        });
      }
    </script>
</head>
<body>
    {{ content }}
</body>
</html>
