<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: page.name | replace: ".md", "" | capitalize }}</title>
    <link rel="stylesheet" href="styl.css">
    
    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register("{{ '/service-worker.js' | relative_url }}").then(function(registration) {
            console.log('ServiceWorker registrován!');
          }, function(err) {
            console.log('ServiceWorker selhal: ', err);
          });
        });
      }
    </script>
</head>
<body>
    {{ content }}
</body>
</html>
