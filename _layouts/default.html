<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.name | replace: ".md", "" | capitalize }}</title>
    <link rel="stylesheet" href="styl.css">
    
    <style>
        /* Pouze hlavní název stránky na střed */
        .page-header-title {
            text-align: center;
            text-transform: uppercase;
            font-size: 3em;
            font-weight: 900;
            margin: 40px 0;
            letter-spacing: 2px;
            display: block; /* Zajistí, že zabere celou šířku pro centrování */
        }

        /* Všechny ostatní nadpisy a text v obsahu budou vlevo */
        main {
            text-align: left;
        }

        main h1, main h2, main h3, main h4 {
            text-align: left;
            margin-top: 1.5em;
        }
    </style>

    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register("{{ '/service-worker.js' | relative_url }}").then(function(registration) {
            console.log('ServiceWorker registrován!');
          }, function(err) {
            console.log('ServiceWorker selhal: ', err);
          });
        });
      }
    </script>
</head>
<body>

    <header>
        <h1 class="page-header-title">
            {{ page.name | replace: ".md", "" }}
        </h1>
    </header>

    <main>
        {{ content }}
    </main>

</body>
</html>
